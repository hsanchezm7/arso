server.port=8083

spring.application.name=compraventa
spring.main.banner-mode=off

spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/compraventas}
spring.data.mongodb.database=${MONGO_DB:compraventas_db}

servicios.usuarios.url=${USUARIOS_URL:http://localhost:8081/}
servicios.productos.url=${PRODUCTOS_URL:http://localhost:8082/}

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:arso}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:arso}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

logging.level.es.um.arso.compraventa=DEBUG

jwt.secret=arso-secret
jwt.cookie.name=jwt
