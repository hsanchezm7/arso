server.port=8082

spring.application.name=productos
spring.main.banner-mode=off

spring.datasource.url=${PRODUCTOS_DB_URL:jdbc:mysql://localhost:3306/productos_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:practicas}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:arso}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:arso}

jwt.secret=${JWT_SECRET}
