server.port=8080
spring.application.name=pasarela

zuul.sensitiveHeaders=

zuul.routes.usuarios.path=/usuarios/**
zuul.routes.usuarios.url=http://usuarios:8081/api/usuarios

zuul.routes.productos.path=/productos/**
zuul.routes.productos.url=http://productos:8082/productos

zuul.routes.compraventa.path=/compraventas/**
zuul.routes.compraventa.url=http://compraventa:8083/compraventas

zuul.routes.valoraciones.path=/valoraciones/**
zuul.routes.valoraciones.url=http://valoraciones:8084/api/valoraciones

servicios.usuarios.url=http://usuarios:8081/

jwt.secret=arso-secret
jwt.expirationSeconds=3600
jwt.cookie.name=jwt
jwt.cookie.maxAge=3600
jwt.cookie.path=/
jwt.cookie.secure=false

spring.security.oauth2.client.registration.github.clientId=
spring.security.oauth2.client.registration.github.clientSecret=
spring.security.oauth2.client.registration.github.scope=read:user,user:email
