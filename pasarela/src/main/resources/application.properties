server.port=8080

spring.application.name=pasarela
spring.main.banner-mode=off

zuul.sensitiveHeaders=

zuul.routes.usuarios.path=/usuarios/**
zuul.routes.usuarios.url=${USUARIOS_URL:http://localhost:8081/}api/usuarios

zuul.routes.productos.path=/productos/**
zuul.routes.productos.url=${PRODUCTOS_URL:http://localhost:8082/}productos

zuul.routes.compraventa.path=/compraventas/**
zuul.routes.compraventa.url=${COMPRAVENTA_URL:http://localhost:8083/}compraventas

zuul.routes.valoraciones.path=/valoraciones/**
zuul.routes.valoraciones.url=${VALORACIONES_URL:http://localhost:8084/}api/valoraciones

servicios.usuarios.url=${USUARIOS_URL:http://localhost:8081/}

jwt.secret=${JWT_SECRET}
jwt.access.expirationSeconds=900
jwt.refresh.expirationSeconds=604800
jwt.refresh.cookie.name=refreshToken
jwt.refresh.cookie.maxAge=604800
jwt.refresh.cookie.path=/auth/refresh
jwt.refresh.cookie.secure=false

spring.security.oauth2.client.registration.github.clientId=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.clientSecret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=read:user,user:email

cors.allowed-origins=${FRONTEND_URL:http://localhost:5173}
frontend.oauth2.redirect-url=${FRONTEND_URL:http://localhost:5173}/oauth2/redirect