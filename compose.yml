services:
  mongo:
    image: mongo:latest
    container_name: mongo
    ports:
      - "27018:27017"
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mongo-express:
    image: mongo-express:latest
    container_name: mongo-express
    ports:
      - "8085:8085"
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: arso
      RABBITMQ_DEFAULT_PASS: arso
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-rabbitmq_management load_definitions \"/etc/rabbitmq/definitions.json\""
    volumes:
      - ./definitions.json:/etc/rabbitmq/definitions.json:ro
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
  mysql:
    image: mysql:latest
    container_name: mysql
    ports:
      - "3307:3306"
    restart: unless-stopped
    env_file: .env
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  pasarela:
    build:
      context: .
      dockerfile: pasarela/Dockerfile
    container_name: pasarela
    ports:
      - "8080:8080"
    env_file: .env
    depends_on:
      - usuarios
      - productos
    restart: unless-stopped

  usuarios:
    build:
      context: .
      dockerfile: usuarios/Dockerfile
    container_name: usuarios
    ports:
      - "8081:8081"
    env_file: .env
    environment:
      JAVA_OPTIONS: "-Djetty.http.port=8081"
    depends_on:
      rabbitmq:
        condition: service_healthy
      mysql:
        condition: service_healthy
      productos:
        condition: service_started
    restart: unless-stopped

  productos:
    build:
      context: .
      dockerfile: productos/Dockerfile
    container_name: productos
    ports:
      - "8082:8082"
    env_file: .env
    depends_on:
      mysql:
          condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  compraventa:
    build:
      context: .
      dockerfile: compraventa/Dockerfile
    container_name: compraventa
    ports:
      - "8083:8083"
    env_file: .env
    depends_on:
      mongo:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  valoraciones:
    build:
      context: ./ValoracionesApi
      dockerfile: Dockerfile
    container_name: valoraciones
    ports:
      - "8084:8084"
    env_file: .env
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    
volumes:
    mongo_data:
    rabbitmq_data:
    mysql_data:
